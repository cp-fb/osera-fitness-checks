# The file a patch repository carries, .github/workflows/osera-fitness.yaml, on the patch branch.
# On push of a release tag it calls the OSERA fitness check library. Nothing else to configure.
name: OSERA fitness checks
run-name: OSERA fitness checks on ${{ github.ref_name }}

on:
  push:
    tags: ['v*\+osera-patch.*'] # the + must be escaped, GitHub treats it as a special character in tag filters

permissions:
  contents: read # for checking out the repository.
  id-token: write # for creating OIDC tokens for signing.
  attestations: write # for GitHub Attestations.

jobs:
  fitness:
    uses: finos-osera/osera-fitness-checks/.github/workflows/fitness.yaml@v1
    with:
      tag: ${{ github.ref_name }}
