name: e2e

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {} # nothing unless a job says so

jobs:
  # one run per reference repository, through the reusable workflow itself (the workflow honours the reference input
  # only when its caller is the library): the known good and the known mistakes
  good:
    uses: ./.github/workflows/fitness.yaml
    permissions:
      contents: read # for checking out the reference.
      id-token: write # for creating OIDC tokens for signing.
      attestations: write # for GitHub Attestations.
    with:
      tag: v2.14.2+osera-patch.001
      reference: d1gital-f/patch-jackson-core
  mistakes:
    uses: ./.github/workflows/fitness.yaml
    permissions:
      contents: read # for checking out the reference.
      id-token: write # for creating OIDC tokens for signing.
      attestations: write # for GitHub Attestations.
    with:
      tag: v1.16.0+osera-patch.001
      reference: d1gital-f/patch-commons-codec
  compare:
    needs: [good, mistakes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: osera-fitness-result-*
      - name: Compare with the expected statuses
        run: |
          failed=0
          for ref in patch-jackson-core patch-commons-codec; do
            jq -r '(.checks + .proposals)[] | "\(.requirement) \(.status)"' "osera-fitness-result-$ref/result.json" > "actual-$ref.txt"
            if diff "e2e/expected-$ref.txt" "actual-$ref.txt"; then echo "e2e $ref: every status as expected"; else echo "e2e $ref: DIFFERS from the expected list"; failed=1; fi
          done
          exit "$failed"
