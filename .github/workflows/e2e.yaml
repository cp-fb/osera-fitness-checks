name: e2e

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  fitness:
    # every check against the playground fork at its release tag, through the reusable workflow itself
    uses: ./.github/workflows/fitness.yaml
    permissions:
      contents: read # for checking out the fixture.
      id-token: write # for creating OIDC tokens for signing.
      attestations: write # for GitHub Attestations.
    with:
      tag: v2.14.2+osera-patch.001
      repository: d1gital-f/patch-jackson-core
      expected-org: d1gital-f
      library-ref: ${{ github.sha }}
  compare:
    needs: [fitness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osera-fitness-result
      - name: Compare with the expected statuses
        run: |
          jq -r '(.requirements + .proposals)[] | "\(.requirement) \(.status)"' result.json > actual.txt
          diff e2e/expected.txt actual.txt && echo "e2e: every status as expected"
