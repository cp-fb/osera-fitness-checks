name: lint

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint on the workflows
        run: find .github/workflows -name '*.yaml' | xargs ./actionlint
      - name: Run shellcheck on the shared library and on every action's bash
        run: |
          shellcheck -s bash lib/record.sh
          for f in .github/actions/*/action.yml; do
            yq '.runs.steps[] | select(.shell == "bash") | .run' "$f" | shellcheck -s bash -S warning -e SC2016,SC2086,SC1090,SC1091 - || { echo "shellcheck failed on $f"; exit 1; }
          done
