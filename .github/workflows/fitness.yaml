name: fitness

on:
  workflow_call:
    inputs:
      tag:
        description: 'the release tag under test, for example v2.14.2+osera-patch.001'
        required: true
        type: string
      reference:
        description: 'only for the library testing itself: which reference repository to check (owner/name); ignored for every other caller'
        required: false
        default: ''
        type: string
    outputs:
      result:
        description: 'pass, warn or fail'
        value: ${{ jobs.fitness.outputs.result }}

jobs:
  fitness:
    runs-on: ubuntu-latest
    # Fixed here, never taken from the caller: where this library lives (also the organisation FORK-001 expects),
    # the tag the actions are checked out at, and the reference repository the library's own e2e checks.
    # At the move to finos-osera these lines change and nothing else.
    env:
      LIBRARY: d1gital-f/osera-fitness-checks
      LIBRARY_REF: v1 # the moving major tag the callers pin; the result records the exact commit it resolved to
      REFERENCE: d1gital-f/patch-jackson-core
    outputs:
      result: ${{ steps.result.outputs.result }}
    permissions:
      contents: read # for checking out the patch repository and reading its commits through the API.
      id-token: write # for creating OIDC tokens for signing.
      attestations: write # for GitHub Attestations.
    steps:
      - name: Setting the workflow caller (a fork or the library itself for e2e testing)
        id: target
        env:
          CALLER: ${{ github.repository }}
          OSERA_TAG: ${{ inputs.tag }}
          THIS_COMMIT: ${{ github.sha }}
          REFERENCE_INPUT: ${{ inputs.reference }}
        run: |
          # a producer's run checks the producer's repository with the actions at the released tag;
          # the library's own e2e checks the reference with the actions at the commit under test
          if [ "$CALLER" = "$LIBRARY" ]; then TARGET="${REFERENCE_INPUT:-$REFERENCE}"; REF="$THIS_COMMIT"; else TARGET="$CALLER"; REF="$LIBRARY_REF"; fi
          echo "repository=$TARGET" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET##*/}" >> "$GITHUB_OUTPUT"
          echo "owner=${LIBRARY%%/*}" >> "$GITHUB_OUTPUT"
          echo "library-ref=$REF" >> "$GITHUB_OUTPUT"
          echo "checking $TARGET at $OSERA_TAG, library $LIBRARY at $REF"
      - name: Checkout the patch repository at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' && git fetch --tags origin
      - name: The tagged commit
        id: commit
        env:
          OSERA_TAG: ${{ inputs.tag }}
        run: echo "sha=$(git rev-parse "refs/tags/${OSERA_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Checkout the osera-fitness-checks library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LIBRARY }}
          ref: ${{ steps.target.outputs.library-ref }}
          path: .osera-fitness
      - name: The exact library commit the checks run from, recorded in the result
        id: library
        run: echo "commit=$(git -C .osera-fitness rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: FORK-001.REQ-001
        uses: ./.osera-fitness/.github/actions/fork-001-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
          expected-org: ${{ steps.target.outputs.owner }}
      - name: FORK-001.REQ-002
        uses: ./.osera-fitness/.github/actions/fork-001-req-002
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: FORK-002.REQ-001
        uses: ./.osera-fitness/.github/actions/fork-002-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: FORK-003.REQ-001
        uses: ./.osera-fitness/.github/actions/fork-003-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: SRC-002.REQ-001
        uses: ./.osera-fitness/.github/actions/src-002-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: SRC-002.REQ-002
        uses: ./.osera-fitness/.github/actions/src-002-req-002
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: SRC-003.REQ-001
        uses: ./.osera-fitness/.github/actions/src-003-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: REL-001.REQ-001
        uses: ./.osera-fitness/.github/actions/rel-001-req-001
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: CP-REL-004-01 (proposal)
        uses: ./.osera-fitness/.github/actions/proposal-rel-004-producer-named
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: CP-REL-004-02 (proposal)
        uses: ./.osera-fitness/.github/actions/proposal-rel-004-producer-approved
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: CP-REL-004-03 (proposal)
        uses: ./.osera-fitness/.github/actions/proposal-rel-004-accounts-in-entry
        continue-on-error: true
        with:
          tag: ${{ inputs.tag }}
          repository: ${{ steps.target.outputs.repository }}
      - name: Write the result
        id: result
        uses: ./.osera-fitness/.github/actions/write-result
        with:
          tag: ${{ inputs.tag }}
          library: ${{ env.LIBRARY }}@${{ steps.library.outputs.commit }}
          repository: ${{ steps.target.outputs.repository }}
      - name: Attest the result
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result.json
          predicate-type: https://osera.finos.org/fitness-result/v1
          predicate-path: result.json
      - name: Attest the result for the gate, under a digest the gate can compute from the tag alone
        # subject = sha256 of the tagged commit id (40 hex characters, no newline); the predicate is the whole result.
        # The gate knows the tag, gets the commit from GitHub, hashes it, and fetches this attestation by that digest.
        id: subject
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          echo "digest=$(printf '%s' "$COMMIT" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=git:$REPOSITORY@$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: sha256:${{ steps.subject.outputs.digest }}
          predicate-type: https://osera.finos.org/fitness-result/v1
          predicate-path: result.json
      - name: Keep the bundle next to the result
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" result.sigstore.json
      - name: Upload the result and its bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osera-fitness-result-${{ steps.target.outputs.name }}
          path: |
            result.json
            result.sigstore.json
      - name: Blocking checks decide
        # a producer's run is red when a blocking check failed; when the library tests itself the compare job decides instead
        if: ${{ github.repository != env.LIBRARY }}
        env:
          RESULT: ${{ steps.result.outputs.result }}
        run: test "$RESULT" != "fail"
