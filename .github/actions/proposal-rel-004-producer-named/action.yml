name: CP-REL-004-01 (proposal)
description: "ControlPlane proposal (remediation-standards 52), not a requirement on the site: the evidence file has a producer line. Warns, never fails"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: CP-REL-004-01 (proposal)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-004 CP-REL-004-01 ""
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || { record REL-004 CP-REL-004-01 "" warn "$F missing"; exit 0; }
        P="$(yq -r '.producer // ""' "$F")"
        if [ -n "$P" ]; then record REL-004 CP-REL-004-01 "" pass "producer named: $P"; else record REL-004 CP-REL-004-01 "" warn "no producer line in $F"; fi
