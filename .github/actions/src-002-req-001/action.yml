name: SRC-002.REQ-001
description: "Backport evidence must link to the upstream commit, commit range, pull request, advisory, or release note defining the fix"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-002 SRC-002.REQ-001 "SRC-002.CHECK-001"
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "$F missing"
        COUNT="$(yq '.fixes | length' "$F")"
        if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "evidence file has no fixes list"; fi
        MISSING="$(yq -r '.fixes[] | select(.upstream == null or .upstream == "") | .cve // "?"' "$F" | paste -sd, -)"
        [ -z "$MISSING" ] || record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "no upstream link for $MISSING"
        LINKS="$(yq -r '.fixes[] | "\(.cve) -> \(.upstream)"' "$F" | paste -sd";" -)"
        record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 pass "$COUNT fix(es), each with an upstream link: $LINKS"
