name: SRC-002.REQ-001
description: "Backport evidence must link to the upstream commit, commit range, pull request, advisory, or release note defining the fix"
author: ControlPlane for the FINOS OSERA Exchange
inputs:
  tag:
    description: 'the release tag under test, for example v2.14.2+osera-patch.001'
    required: true
  repository:
    description: 'the patch repository under test, owner/name (GitHub does not let a workflow override GITHUB_REPOSITORY)'
    required: false
    default: ${{ github.repository }}
  expected-org:
    description: 'organisation the patch repositories must live in (FORK-001)'
    required: false
    default: 'finos-osera'
  approved-producers:
    description: 'the approved producers file (the REL-004 proposals)'
    required: false
    default: '.osera-fitness/approved-producers/approved_producers.yaml'
  actor:
    description: 'the account that pushed the tag (the REL-004 proposals)'
    required: false
    default: ${{ github.actor }}
  results-dir:
    description: 'where the record goes'
    required: false
    default: '.osera-results'
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-001
      shell: bash
      env:
        OSERA_TAG: ${{ inputs.tag }}
        OSERA_REPOSITORY: ${{ inputs.repository }}
        OSERA_EXPECTED_ORG: ${{ inputs.expected-org }}
        OSERA_APPROVED_PRODUCERS: ${{ inputs.approved-producers }}
        OSERA_ACTOR: ${{ inputs.actor }}
        OSERA_RESULTS_DIR: ${{ inputs.results-dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "$F missing"
        COUNT="$(yq '.fixes | length' "$F")"
        if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "evidence file has no fixes list"; fi
        MISSING="$(yq -r '.fixes[] | select(.upstream == null or .upstream == "") | .cve // "?"' "$F" | paste -sd, -)"
        [ -z "$MISSING" ] || record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 fail "no upstream link for $MISSING"
        LINKS="$(yq -r '.fixes[] | "\(.cve) -> \(.upstream)"' "$F" | paste -sd";" -)"
        record SRC-002 SRC-002.REQ-001 SRC-002.CHECK-001 pass "$COUNT fix(es), each with an upstream link: $LINKS"
