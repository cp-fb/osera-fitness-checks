name: FORK-003.REQ-001
description: "Patch providers must tag the unpatched baseline source commit using v<VERSION>+patch.baseline"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-003.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-003 FORK-003.REQ-001 "FORK-003.CHECK-001"
        SHA="$(git rev-parse -q --verify "refs/tags/${BASE}^{commit}" || true)"
        if [ -z "$SHA" ]; then record FORK-003 FORK-003.REQ-001 FORK-003.CHECK-001 fail "tag $BASE missing"
        elif git merge-base --is-ancestor "$SHA" "refs/tags/$OSERA_TAG"; then record FORK-003 FORK-003.REQ-001 FORK-003.CHECK-001 pass "$BASE resolves to $SHA and is an ancestor of $OSERA_TAG"
        else record FORK-003 FORK-003.REQ-001 FORK-003.CHECK-001 fail "$BASE ($SHA) is not an ancestor of $OSERA_TAG"; fi
