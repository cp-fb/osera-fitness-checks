name: CP-REL-004-03 (proposal)
description: "ControlPlane proposal (remediation-standards 52): the account that pushed the tag and the accounts on the commits between the baseline tag and the release tag are all in that producer entry's github_users. Warns, never fails"
author: ControlPlane for the FINOS OSERA Exchange
inputs:
  tag:
    description: 'the release tag under test, for example v2.14.2+osera-patch.001'
    required: true
  repository:
    description: 'the patch repository under test, owner/name (GitHub does not let a workflow override GITHUB_REPOSITORY)'
    required: false
    default: ${{ github.repository }}
  expected-org:
    description: 'organisation the patch repositories must live in (FORK-001)'
    required: false
    default: 'finos-osera'
  approved-producers:
    description: 'the approved producers file (the REL-004 proposals)'
    required: false
    default: '.osera-fitness/approved-producers/approved_producers.yaml'
  actor:
    description: 'the account that pushed the tag (the REL-004 proposals)'
    required: false
    default: ${{ github.actor }}
  results-dir:
    description: 'where the record goes'
    required: false
    default: '.osera-results'
runs:
  using: composite
  steps:
    - name: CP-REL-004-03 (proposal)
      shell: bash
      env:
        OSERA_TAG: ${{ inputs.tag }}
        OSERA_REPOSITORY: ${{ inputs.repository }}
        OSERA_EXPECTED_ORG: ${{ inputs.expected-org }}
        OSERA_APPROVED_PRODUCERS: ${{ inputs.approved-producers }}
        OSERA_ACTOR: ${{ inputs.actor }}
        OSERA_RESULTS_DIR: ${{ inputs.results-dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || { record REL-004 CP-REL-004-03 "" warn "$F missing"; exit 0; }
        P="$(yq -r '.producer // ""' "$F")"
        ALLOWED="$(P="$P" yq -r '.producers[] | select(.id == env(P)) | .github_users[]' "$OSERA_APPROVED_PRODUCERS" | sort -u)"
        [ -n "$ALLOWED" ] || { record REL-004 CP-REL-004-03 "" warn "producer '$P' has no approved producers entry with github_users, cannot check accounts"; exit 0; }
        SHAS="$(git rev-list "${BASE}..${OSERA_TAG}")"; ACCOUNTS=""
        for S in $SHAS; do ACCOUNTS="$ACCOUNTS $(gh api "repos/${OSERA_REPOSITORY}/commits/${S}" --jq '[.author.login, .committer.login] | map(select(. != null and . != "web-flow")) | .[]' 2>/dev/null | paste -sd" " -)"; done
        ACCOUNTS="$(echo "$OSERA_ACTOR" $ACCOUNTS | tr " " "\n" | grep -v "^$" | sort -u)"
        BAD="$(comm -23 <(echo "$ACCOUNTS") <(echo "$ALLOWED") | paste -sd, -)"
        DETAIL="tag pushed by $OSERA_ACTOR; $(echo "$SHAS" | wc -l | tr -d " ") commit(s) since $BASE, accounts $(echo "$ACCOUNTS" | paste -sd, -); allowed for '$P': $(echo "$ALLOWED" | paste -sd, -)"
        if [ -n "$BAD" ]; then record REL-004 CP-REL-004-03 "" warn "account(s) not in the producer's approved producers entry: $BAD. $DETAIL"; else record REL-004 CP-REL-004-03 "" pass "$DETAIL"; fi
