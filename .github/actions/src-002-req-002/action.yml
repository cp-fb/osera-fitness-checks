name: SRC-002.REQ-002
description: "Backported commits carrying upstream-authored code should name the upstream commit and include a Co-authored-by trailer for the upstream author (SHOULD, advisory)"
author: ControlPlane for the FINOS OSERA Exchange
inputs:
  tag:
    description: 'the release tag under test, for example v2.14.2+osera-patch.001'
    required: true
  repository:
    description: 'the patch repository under test, owner/name (GitHub does not let a workflow override GITHUB_REPOSITORY)'
    required: false
    default: ${{ github.repository }}
  expected-org:
    description: 'organisation the patch repositories must live in (FORK-001)'
    required: false
    default: 'finos-osera'
  registry:
    description: 'the approved producer registry file (the REL-004 proposals)'
    required: false
    default: '.osera-fitness/registry/approved_producers.yaml'
  actor:
    description: 'the account that pushed the tag (the REL-004 proposals)'
    required: false
    default: ${{ github.actor }}
  results-dir:
    description: 'where the record goes'
    required: false
    default: '.osera-results'
runs:
  using: composite
  steps:
    - name: SRC-002.REQ-002
      shell: bash
      env:
        OSERA_TAG: ${{ inputs.tag }}
        OSERA_REPOSITORY: ${{ inputs.repository }}
        OSERA_EXPECTED_ORG: ${{ inputs.expected-org }}
        OSERA_REGISTRY: ${{ inputs.registry }}
        OSERA_ACTOR: ${{ inputs.actor }}
        OSERA_RESULTS_DIR: ${{ inputs.results-dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${OSERA_TAG#v}"; VERSION="${VERSION%%+*}"
        BASE="v${VERSION}+patch.baseline"
        mkdir -p "$OSERA_RESULTS_DIR"
        record() { # record <standard> <requirement> <check id or empty> <status> <evidence>
          jq -n --arg standard "$1" --arg requirement "$2" --arg check "$3" --arg status "$4" --arg evidence "$5" \
            '{standard: $standard, standard_version: "0.1.0", requirement: $requirement, check: (if $check == "" then null else $check end), status: $status, evidence: $evidence}' \
            > "$OSERA_RESULTS_DIR/$2.json"
          echo "$2 $4: $5"
          [ "$4" != "fail" ]
        }
        # a commit carries upstream authored code when its message names an upstream commit
        TOTAL="$(git rev-list --count "${BASE}..${OSERA_TAG}")"
        CARRYING="$(git log --format=%H "${BASE}..${OSERA_TAG}" -i --extended-regexp --grep="(cherry picked from commit|backport of|upstream commit|upstream:) *[0-9a-f]{7,40}")"
        if [ -z "$CARRYING" ]; then record SRC-002 SRC-002.REQ-002 SRC-002.CHECK-002 not-applicable "$TOTAL commit(s) between $BASE and $OSERA_TAG, none declares upstream authored code (no cherry pick or backport line naming an upstream commit)"; exit 0; fi
        MISSING=""
        for C in $CARRYING; do git log -1 --format=%B "$C" | grep -q "^Co-authored-by:" || MISSING="$MISSING ${C:0:12}"; done
        if [ -n "$MISSING" ]; then record SRC-002 SRC-002.REQ-002 SRC-002.CHECK-002 warn "commit(s) naming an upstream commit without a Co-authored-by trailer:$MISSING"
        else record SRC-002 SRC-002.REQ-002 SRC-002.CHECK-002 pass "$(echo "$CARRYING" | wc -l | tr -d " ") commit(s) name an upstream commit and carry a Co-authored-by trailer"; fi
