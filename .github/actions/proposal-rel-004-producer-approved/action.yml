name: CP-REL-004-02 (proposal)
description: "ControlPlane proposal (remediation-standards 52): the producer named in the evidence file is in the approved producers. Warns, never fails"
author: ControlPlane for the FINOS OSERA Exchange
inputs:
  tag:
    description: 'the release tag under test, for example v2.14.2+osera-patch.001'
    required: true
  repository:
    description: 'the patch repository under test, owner/name (GitHub does not let a workflow override GITHUB_REPOSITORY)'
    required: false
    default: ${{ github.repository }}
  expected-org:
    description: 'organisation the patch repositories must live in (FORK-001)'
    required: false
    default: 'finos-osera'
  approved-producers:
    description: 'the approved producers file (the REL-004 proposals)'
    required: false
    default: '.osera-fitness/approved-producers/approved_producers.yaml'
  actor:
    description: 'the account that pushed the tag (the REL-004 proposals)'
    required: false
    default: ${{ github.actor }}
  results-dir:
    description: 'where the record goes'
    required: false
    default: '.osera-results'
runs:
  using: composite
  steps:
    - name: CP-REL-004-02 (proposal)
      shell: bash
      env:
        OSERA_TAG: ${{ inputs.tag }}
        OSERA_REPOSITORY: ${{ inputs.repository }}
        OSERA_EXPECTED_ORG: ${{ inputs.expected-org }}
        OSERA_APPROVED_PRODUCERS: ${{ inputs.approved-producers }}
        OSERA_ACTOR: ${{ inputs.actor }}
        OSERA_RESULTS_DIR: ${{ inputs.results-dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || { record REL-004 CP-REL-004-02 "" warn "$F missing"; exit 0; }
        P="$(yq -r '.producer // ""' "$F")"; N="$(yq '.producers | length' "$OSERA_APPROVED_PRODUCERS")"
        if [ -n "$(P="$P" yq '.producers[] | select(.id == env(P)) | .id' "$OSERA_APPROVED_PRODUCERS")" ]; then record REL-004 CP-REL-004-02 "" pass "producer '$P' is in the approved producers ($OSERA_APPROVED_PRODUCERS, $N entries)"
        else record REL-004 CP-REL-004-02 "" warn "producer '$P' is not in the approved producers ($OSERA_APPROVED_PRODUCERS, ids: $(yq -r '.producers[].id' "$OSERA_APPROVED_PRODUCERS" | paste -sd, -))"; fi
