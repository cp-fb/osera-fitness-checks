name: CP-REL-004-02 (proposal)
description: "ControlPlane proposal (remediation-standards 52): the producer named in the evidence file is in the approved producers. Warns, never fails"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: CP-REL-004-02 (proposal)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-004 CP-REL-004-02 ""
        F=.osera/patch-evidence.yaml
        [ -f "$F" ] || { record REL-004 CP-REL-004-02 "" warn "$F missing"; exit 0; }
        P="$(yq -r '.producer // ""' "$F")"; N="$(yq '.producers | length' "$OSERA_APPROVED_PRODUCERS")"
        if [ -n "$(P="$P" yq '.producers[] | select(.id == env(P)) | .id' "$OSERA_APPROVED_PRODUCERS")" ]; then record REL-004 CP-REL-004-02 "" pass "producer '$P' is in the approved producers ($OSERA_APPROVED_PRODUCERS, $N entries)"
        else record REL-004 CP-REL-004-02 "" warn "producer '$P' is not in the approved producers ($OSERA_APPROVED_PRODUCERS, ids: $(yq -r '.producers[].id' "$OSERA_APPROVED_PRODUCERS" | paste -sd, -))"; fi
