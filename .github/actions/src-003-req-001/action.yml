name: SRC-003.REQ-001
description: "New source or test files added by a patch must follow the prevailing license-header convention of the surrounding project"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: SRC-003.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is SRC-003 SRC-003.REQ-001 "SRC-003.CHECK-001"
        git rev-parse -q --verify "refs/tags/${BASE}^{commit}" >/dev/null   # no baseline tag, no range to look at: not-tested
        # the leading block comment of a file, years replaced by YEAR, whitespace and asterisks removed; empty when the file does not start with one
        header() { git show "${OSERA_TAG}:$1" | awk 'BEGIN{c=0} c==0 && /^[[:space:]]*$/ {next} c==0 && $0 !~ /^[[:space:]]*\/\*/ {exit} {c=1; print} /\*\// {exit}' | sed -E 's/(19|20)[0-9]{2}([[:space:]]*[-,][[:space:]]*(19|20)[0-9]{2})*/YEAR/g' | tr -d " \t\r\n*"; }
        # the nearest existing file of the same extension and kind (test or main), walking up the directories
        nearest() { local P="$1" D K F; case "$P" in */test/*) K="test" ;; *) K="main" ;; esac; D="$(dirname "$P")"
          while [ "$D" != "." ] && [ "$D" != "/" ]; do
            for F in $(git ls-tree -r --name-only "$OSERA_TAG" "$D"); do
              [ "$F" = "$P" ] && continue; [ "${F##*.}" = "${P##*.}" ] || continue
              case "$F" in */test/*) [ "$K" = test ] || continue ;; *) [ "$K" = main ] || continue ;; esac
              echo "$F"; return; done
            D="$(dirname "$D")"; done; }
        ADDED="$(git diff --name-only --diff-filter=A "$BASE" "$OSERA_TAG" | grep -E '\.(java|kt|groovy|scala)$' || true)"
        if [ -z "$ADDED" ]; then record SRC-003 SRC-003.REQ-001 SRC-003.CHECK-001 not-applicable "no new source or test files since $BASE"; exit 0; fi
        CHECKED=0; PROBLEMS=""
        for P in $ADDED; do
          N="$(nearest "$P")"; [ -n "$N" ] || continue
          REF="$(header "$N")"; [ -n "$REF" ] || continue
          CHECKED=$((CHECKED+1))
          [ "$(header "$P")" = "$REF" ] || PROBLEMS="$PROBLEMS $P (expected the header of $N);"
        done
        if [ "$CHECKED" = 0 ]; then record SRC-003 SRC-003.REQ-001 SRC-003.CHECK-001 not-applicable "$(echo "$ADDED" | wc -l | tr -d " ") new file(s), no determinable header convention nearby"
        elif [ -n "$PROBLEMS" ]; then record SRC-003 SRC-003.REQ-001 SRC-003.CHECK-001 fail "header differs on:$PROBLEMS"
        else record SRC-003 SRC-003.REQ-001 SRC-003.CHECK-001 pass "$CHECKED new file(s) carry the local header convention"; fi
