name: FORK-001.REQ-001
description: "Patched-source repositories must live in github.com/finos-osera unless the working group approves an exception"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: FORK-001.REQ-001
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is FORK-001 FORK-001.REQ-001 "FORK-001.CHECK-001"
        ORG="${OSERA_REPOSITORY%%/*}"
        if [ "$ORG" = "$OSERA_EXPECTED_ORG" ]; then record FORK-001 FORK-001.REQ-001 FORK-001.CHECK-001 pass "repository $OSERA_REPOSITORY is in $OSERA_EXPECTED_ORG"
        else record FORK-001 FORK-001.REQ-001 FORK-001.CHECK-001 fail "repository $OSERA_REPOSITORY is not in $OSERA_EXPECTED_ORG"; fi
